# The production stack. GitHub Actions builds both images and pushes them to
# GHCR; nothing is built on the host. Coolify runs its own copy of this file,
# so a change here reaches production only once it's made there too.
# Only web gets a domain. It reaches the API over this compose network and
# forwards /api/* to it, so the API is never public.
services:
  api:
    image: ghcr.io/jtayped/rungs-api:${TAG:-main}
    # `main` moves on every release, so a cached copy is never trusted.
    pull_policy: always
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # A Postgres on the coolify network, reached by its container name.
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SITE_URL: https://rungs.joeltaylor.business
    # default keeps web able to reach the api; coolify is where the database is.
    networks: [default, coolify]
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # The first check otherwise waits a full interval, and nothing routes to
      # a container until it passes.
      start_period: 30s
      start_interval: 1s

  web:
    image: ghcr.io/jtayped/rungs-web:${TAG:-main}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
      SITE_URL: https://rungs.joeltaylor.business
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # The first check otherwise waits a full interval, and nothing routes to
      # a container until it passes.
      start_period: 30s
      start_interval: 1s

networks:
  coolify:
    external: true
