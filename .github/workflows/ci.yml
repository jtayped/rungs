name: ci

# main keeps the push trigger because release.yml starts from this workflow
# completing on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # For the route test, which also applies every migration to an empty
      # database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rungs
          POSTGRES_PASSWORD: rungs
          POSTGRES_DB: rungs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://rungs:rungs@localhost:5432/rungs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # The tests use a fake judge, so no OpenRouter key is needed here.
      - run: pnpm turbo run lint typecheck test build
