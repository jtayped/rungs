name: release

# Starts from ci finishing rather than from the push, so an image is never
# published from code nothing verified. `workflow_run` does not check that the
# run passed or which branch it was on; the `if:` on the build job does.
#
# `workflow_run` only fires the copy of this file on the default branch, so a
# pull request can't exercise changes to it. Use workflow_dispatch once merged.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Under workflow_run, `github.sha` is the default branch head at dispatch
  # time, not necessarily the commit ci checked. Pin everything to that one.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `main` is the tag Coolify tracks. `sha-<full>` is immutable, so a
      # rollback can pin the exact image that ran before. The repo is public,
      # so the registry cache costs nothing to store.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/jtayped/rungs-${{ matrix.app }}:main
            ghcr.io/jtayped/rungs-${{ matrix.app }}:sha-${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          build-args: |
            RUNGS_COMMIT=${{ env.DEPLOY_SHA }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/jtayped/rungs-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=ghcr.io/jtayped/rungs-${{ matrix.app }}:buildcache,mode=max,image-manifest=true

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    # Not cancelled in progress: once Coolify has the webhook, the swap runs on
    # the host whether this job lives or not.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: deploy and wait for the new commit
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_HEALTH_URLS: ${{ vars.COOLIFY_HEALTH_URLS }}
          EXPECTED_COMMIT: ${{ env.DEPLOY_SHA }}
