packages:
  - apps/*
  - tooling/*
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.89'
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - ai@7.0.111
  - framer-motion@13.4.1
  - motion-dom@13.4.1
  - motion@13.4.1
  - next@16.3.6
autoInstallPeers: false
# Next pins these below their security fixes (sharp: CVE-2026-96889 in its
# bundled librsvg; source-map-js: event-loop DoS from crafted section offsets).
# Each override only matches the vulnerable range, so it stops applying once
# Next depends on fixed versions.
overrides:
  sharp@<0.35.5: ^0.35.5
  source-map-js@<1.2.2: ^1.2.2
